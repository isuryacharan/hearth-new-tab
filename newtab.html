<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icons/icon48.png" type="image/png">
  <script src="focus.js"></script>
  <link rel="preload" href="fonts/space-grotesk-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="bg" class="bg" aria-hidden="true"></div>
  <div id="bg-dim" class="bg-dim" aria-hidden="true"></div>
  <div id="bg-depth" class="bg-depth" aria-hidden="true"></div>

  <!-- Glanceable status chips: each shows live info and opens its widget in the drawer -->
  <nav id="dock" class="dock" aria-label="Widgets">
    <button class="dock-chip" type="button" data-panel="weather" data-key="w" aria-controls="drawer">
      <span class="dock-icon" data-icon>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 19a4.5 4.5 0 0 1-.4-9 6 6 0 0 1 11.6 1.5A3.75 3.75 0 0 1 17.25 19z"/></svg>
      </span>
      <span class="dock-text" data-text></span>
    </button>
    <button class="dock-chip" type="button" data-panel="pomo" data-key="p" aria-controls="drawer">
      <span class="dock-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-1 2v4.4l3.3 2 1-1.6-2.3-1.4V8zM9 1h6v2H9z"/></svg>
      </span>
      <span class="dock-text" data-text></span>
    </button>
    <button class="dock-chip" type="button" data-panel="calendar" data-key="c" aria-controls="drawer">
      <span class="dock-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2zM5 9h14v10H5z"/></svg>
      </span>
      <span class="dock-text" data-text></span>
    </button>
    <button class="dock-chip" type="button" data-panel="todo" data-key="t" aria-controls="drawer">
      <span class="dock-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6 11-11-1.4-1.4z"/></svg>
      </span>
      <span class="dock-text" data-text></span>
    </button>
    <button class="dock-chip" type="button" data-panel="notes" data-key="n" aria-controls="drawer">
      <span class="dock-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.33-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg>
      </span>
      <span class="dock-text" data-text></span>
    </button>
    <button class="dock-chip" type="button" data-panel="background" data-key="b" aria-controls="drawer">
      <span class="dock-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/></svg>
      </span>
      <span class="dock-text" data-text></span>
    </button>
  </nav>

  <main id="stage" class="stage">
    <!-- Page 1: just the clock and a search launcher -->
    <section id="page-home" class="layer home" aria-label="Home">
      <div class="home-inner">
        <div class="clock">
          <div class="clock-sharp">
            <div id="time" class="time"></div>
            <div id="date" class="date"></div>
          </div>
          <!-- pre-blurred copy; crossfaded in during page transitions (see CSS) -->
          <div class="clock-ghost" aria-hidden="true">
            <div id="time-ghost" class="time"></div>
            <div id="date-ghost" class="date"></div>
          </div>
        </div>
        <div class="palette">
          <input id="search" class="search" type="search" placeholder="Search, run a command, or type a URL   ( / )" autocomplete="off" spellcheck="false" aria-label="Command palette" autofocus>
          <div class="palette-progress" aria-hidden="true"></div>
          <div class="palette-drop">
            <div id="palette-list" class="palette-list" role="listbox" aria-label="Results" hidden></div>
            <div id="palette-footer" class="palette-footer" hidden>
              <span><kbd>↑</kbd><kbd>↓</kbd> choose</span>
              <span><kbd>↵</kbd> run</span>
              <span><kbd>Ctrl</kbd><kbd>↵</kbd> new tab</span>
              <span><kbd>Tab</kbd> complete</span>
              <span><kbd>?</kbd> commands</span>
            </div>
          </div>
          <p id="palette-toast" class="palette-toast" role="status" aria-live="polite"></p>
        </div>
      </div>
      <figure id="quote" class="quote" hidden>
        <blockquote id="quote-text"></blockquote>
        <figcaption id="quote-author"></figcaption>
        <button id="quote-hide" class="quote-hide" type="button" aria-label="Hide daily quote" title="Hide daily quote">×</button>
      </figure>
      <button id="to-bookmarks" class="page-hint" type="button" aria-label="Show all bookmarks">
        <span>Bookmarks</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg>
      </button>
    </section>

    <!-- Page 2: the full bookmark grid with folders -->
    <section id="page-bookmarks" class="layer bookmarks-layer" aria-label="Bookmarks">
      <div class="bookmarks">
        <div class="bookmarks-main">
          <nav id="crumbs" class="crumbs" aria-label="Folder path"></nav>
          <section id="grid" class="grid" aria-live="polite"></section>
          <p id="empty" class="empty" hidden></p>
        </div>

        <aside class="panel later-col" aria-labelledby="later-title" style="--i: 3">
          <div class="panel-head">
            <h2 id="later-title">Read later</h2>
            <span id="later-count" class="muted"></span>
          </div>
          <ul id="later-list" class="later-list"></ul>
          <p id="later-empty" class="later-empty muted">Right-click any page or link and choose <strong>Add to Read Later</strong>. It shows up here.</p>
        </aside>
      </div>
    </section>
  </main>

  <!-- Drawer: one widget at a time; slides in from the right -->
  <aside id="drawer" class="drawer" aria-label="Widget drawer" hidden>
    <div class="drawer-bar">
      <div class="drawer-tabs" role="tablist" aria-label="Widgets"></div>
      <div class="drawer-actions">
        <button id="drawer-pin" class="icon-btn" type="button" aria-pressed="false" title="Keep open on every new tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3H8v2h1v6l-2 3v2h4.2v5h1.6v-5H17v-2l-2-3V5h1z"/></svg>
        </button>
        <button id="drawer-close" class="icon-btn" type="button" aria-label="Close (Esc)" title="Close (Esc)">×</button>
      </div>
    </div>

    <section class="panel weather" data-panel="weather" data-title="Weather" aria-labelledby="weather-title" hidden>
      <div class="panel-head">
        <h2 id="weather-title">Weather</h2>
        <div class="weather-actions">
          <button id="weather-unit" class="chip" type="button" title="Switch units">°C</button>
          <button id="weather-settings" class="icon-btn" type="button" title="Change city" aria-label="Change city" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          </button>
        </div>
      </div>

      <form id="weather-form" class="weather-form" hidden>
        <input id="weather-city" type="search" placeholder="Search a city" autocomplete="off">
        <ul id="weather-results" class="weather-results"></ul>
      </form>

      <div id="weather-body" class="weather-body">
        <p class="muted">Loading weather…</p>
      </div>
    </section>

    <section class="panel pomo" data-panel="pomo" data-title="Pomodoro" aria-labelledby="pomo-title" hidden>
      <div class="panel-head">
        <h2 id="pomo-title">Pomodoro</h2>
        <div class="weather-actions">
          <span id="pomo-dots" class="pomo-dots"></span>
          <button id="pomo-settings" class="icon-btn" type="button" aria-label="Timer settings" title="Timer settings" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
          </button>
        </div>
      </div>

      <form id="pomo-form" class="pomo-form" hidden>
        <label>Focus <input id="pomo-focus" type="number" min="1" max="180" required> min</label>
        <label>Short break <input id="pomo-short" type="number" min="1" max="180" required> min</label>
        <label>Long break <input id="pomo-long" type="number" min="1" max="180" required> min</label>
        <label class="pomo-check"><input id="pomo-auto" type="checkbox"> Start the next session automatically</label>
        <button id="pomo-reset-count" class="link-btn" type="button">Reset session count</button>
      </form>

      <div class="pomo-modes" role="group" aria-label="Session type">
        <button type="button" class="chip" data-mode="focus">Focus</button>
        <button type="button" class="chip" data-mode="short">Short break</button>
        <button type="button" class="chip" data-mode="long">Long break</button>
      </div>

      <div id="pomo-time" class="pomo-time" role="timer" aria-live="off">25:00</div>
      <div class="pomo-bar" aria-hidden="true"><div id="pomo-progress"></div></div>

      <div class="pomo-controls">
        <button id="pomo-reset" class="icon-btn" type="button" aria-label="Reset timer" title="Reset">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <button id="pomo-start" class="pomo-main" type="button">Start</button>
        <button id="pomo-skip" class="icon-btn" type="button" aria-label="Skip to next session" title="Skip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l9-7-9-7zm10 0h3v14h-3z"/></svg>
        </button>
      </div>
    </section>

    <section class="panel calendar" data-panel="calendar" data-title="Calendar" aria-labelledby="cal-title" hidden>
      <div class="panel-head">
        <h2 id="cal-title">Calendar</h2>
        <div class="cal-nav">
          <button id="cal-prev" class="icon-btn" type="button" aria-label="Previous month">‹</button>
          <button id="cal-month" class="cal-month" type="button" title="Back to today"></button>
          <button id="cal-next" class="icon-btn" type="button" aria-label="Next month">›</button>
        </div>
      </div>
      <div id="cal-weekdays" class="cal-weekdays" aria-hidden="true"></div>
      <div id="cal-grid" class="cal-grid" role="grid" aria-labelledby="cal-month"></div>

      <div class="cal-day">
        <div class="cal-day-head">
          <span id="cal-day-title"></span>
        </div>
        <ul id="cal-events" class="cal-events"></ul>
        <form id="cal-form" class="cal-form">
          <input id="cal-time" type="time" aria-label="Time (optional)">
          <input id="cal-text" type="text" placeholder="Add event" autocomplete="off" maxlength="200" aria-label="Event title">
        </form>
      </div>
    </section>

    <section class="panel" data-panel="todo" data-title="To-do" aria-labelledby="todo-title" hidden>
      <div class="panel-head">
        <h2 id="todo-title">To-do</h2>
        <span id="todo-count" class="muted"></span>
      </div>
      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="Add a task and press Enter" autocomplete="off" maxlength="300">
      </form>
      <ul id="todo-list" class="todo-list"></ul>
      <button id="todo-clear" class="link-btn" type="button" hidden>Clear completed</button>
    </section>

    <section class="panel notes-panel" data-panel="notes" data-title="Notes" aria-labelledby="notes-title" hidden>
      <div class="panel-head">
        <h2 id="notes-title">Notes</h2>
        <span id="notes-status" class="muted"></span>
      </div>
      <textarea id="notes" class="notes" placeholder="Jot something down…" spellcheck="true"></textarea>
    </section>


    <section class="panel bg-panel" data-panel="background" data-title="Background" aria-labelledby="bg-title" hidden>
      <div class="panel-head">
        <h2 id="bg-title">Background</h2>
      </div>

      <label class="bg-upload">
        <input id="bg-file" type="file" accept="image/*,video/*">
        <span>Upload image or video</span>
      </label>

      <form id="bg-url-form" class="bg-url">
        <input id="bg-url" type="url" placeholder="…or paste an image / video URL" autocomplete="off">
        <button type="submit" class="chip">Apply</button>
      </form>

      <label class="bg-dim-row">
        <span>Dim</span>
        <input id="bg-dim-range" type="range" min="0" max="80" step="5" value="25">
        <span id="bg-dim-value" class="muted">25%</span>
      </label>

      <p id="bg-status" class="muted bg-status"></p>
      <button id="bg-reset" class="link-btn" type="button">Reset to default</button>
    </section>
  </aside>

  <script src="storage.js"></script>
  <script src="dock.js"></script>
  <script src="pages.js"></script>
  <script src="newtab.js"></script>
  <script src="widgets.js"></script>
  <script src="weather.js"></script>
  <script src="calendar.js"></script>
  <script src="pomodoro-core.js"></script>
  <script src="pomodoro.js"></script>
  <script src="background.js"></script>
  <script src="readlater.js"></script>
  <script src="palette.js"></script>
  <script src="quote.js"></script>
</body>
</html>
